<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Predictions | Curriculum Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto max-w-7xl px-6 py-8">
      <nav class="mb-8 flex flex-wrap items-center justify-between gap-4 rounded-3xl border border-white/10 bg-white/10 p-4 backdrop-blur-xl">
        <div class="text-lg font-semibold">Curriculum Recommender</div>
        <div class="flex flex-wrap gap-2 text-sm">
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/index.html">Home</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/dashboard.html">Dashboard</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/planner.html">Planner</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/careers.html">Careers</a>
          <a class="rounded-full bg-cyan-500 px-3 py-2 text-slate-950" href="/ui/predictions.html">Predictions</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/methodology.html">Methodology</a>
        </div>
      </nav>
      <header class="mb-8 rounded-3xl border border-cyan-400/20 bg-gradient-to-r from-violet-500/10 to-cyan-500/10 p-8">
        <h1 class="text-3xl font-semibold">Progress prediction</h1>
        <p class="mt-3 max-w-2xl text-slate-300">Use historical progress summaries to estimate how quickly you can complete course or skill targets.</p>
      </header>
      <section class="grid gap-6 lg:grid-cols-[1fr_0.95fr]">
        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6">
          <label class="mb-2 block text-sm text-slate-300" for="historyInput">Historical progress JSON</label>
          <textarea id="historyInput" class="h-48 w-full rounded-2xl border border-white/10 bg-slate-800 p-3 text-sm">[{"skills":["Python","SQL"],"score":70},{"skills":["Python","FastAPI"],"score":82}]</textarea>
          <label class="mt-4 mb-2 block text-sm text-slate-300" for="targetsInput">Targets</label>
          <input id="targetsInput" class="w-full rounded-2xl border border-white/10 bg-slate-800 px-3 py-3" value="FastAPI, Docker" />
          <button id="predictBtn" class="mt-4 rounded-2xl bg-cyan-500 px-4 py-2 font-semibold text-slate-950">Predict progress</button>
        </div>
        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6">
          <h2 class="text-xl font-semibold">Predicted outcomes</h2>
          <div id="predictionResults" class="mt-4 space-y-3"></div>
        </div>
      </section>
    </div>
    <script>
      const results = document.getElementById('predictionResults');
      document.getElementById('predictBtn').addEventListener('click', async () => {
        const history = JSON.parse(document.getElementById('historyInput').value || '[]');
        const targets = document.getElementById('targetsInput').value.split(',').map((item) => item.trim()).filter(Boolean);
        const response = await fetch('/planning/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({history, targets, k:3})});
        const payload = await response.json();
        results.innerHTML = payload.predictions.map((item) => `
          <div class="rounded-2xl border border-white/10 bg-slate-800/80 p-3">
            <div class="flex items-center justify-between">
              <div class="font-semibold">${item.target}</div>
              <div class="text-cyan-300">${item.predicted_score}%</div>
            </div>
            <div class="mt-2 h-2 rounded-full bg-slate-700">
              <div class="h-2 rounded-full bg-gradient-to-r from-cyan-400 to-violet-500" style="width:${item.predicted_score}%"></div>
            </div>
            <div class="mt-2 text-sm text-slate-400">Confidence ${Math.round(item.confidence * 100)}% • Interval ${item.interval.join(' - ')}%</div>
          </div>
        `).join('');
      });
    </script>
  </body>
</html>
