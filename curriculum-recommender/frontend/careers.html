<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Career Selector | Curriculum Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto max-w-7xl px-6 py-8">
      <nav class="mb-8 flex flex-wrap items-center justify-between gap-4 rounded-3xl border border-white/10 bg-white/10 p-4 backdrop-blur-xl">
        <div class="text-lg font-semibold">Curriculum Recommender</div>
        <div class="flex flex-wrap gap-2 text-sm">
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/index.html">Home</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/dashboard.html">Dashboard</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/planner.html">Planner</a>
          <a class="rounded-full bg-cyan-500 px-3 py-2 text-slate-950" href="/ui/careers.html">Careers</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/predictions.html">Predictions</a>
          <a class="rounded-full bg-white/10 px-3 py-2" href="/ui/methodology.html">Methodology</a>
        </div>
      </nav>
      <header class="mb-8 rounded-3xl border border-cyan-400/20 bg-cyan-500/10 p-8">
        <h1 class="text-3xl font-semibold">Career selector</h1>
        <p class="mt-3 max-w-2xl text-slate-300">Search ESCO-style careers, preview required skills, and see the logical milestone path to reach them.</p>
      </header>
      <section class="grid gap-6 lg:grid-cols-[0.95fr_1.05fr]">
        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6">
          <label class="mb-2 block text-sm text-slate-300" for="careerSelect">Choose a career</label>
          <input id="careerSelect" list="careerOptions" class="w-full rounded-2xl border border-white/10 bg-slate-800 px-3 py-3" placeholder="Search backend, data or AI" />
          <datalist id="careerOptions">
            <option>Backend Engineer</option>
            <option>Data Scientist</option>
            <option>AI Engineer</option>
            <option>Full Stack Engineer</option>
          </datalist>
          <button id="careerBtn" class="mt-4 rounded-2xl bg-cyan-500 px-4 py-2 font-semibold text-slate-950">Preview career path</button>
          <div id="careerSummary" class="mt-6 rounded-2xl border border-white/10 bg-slate-800/70 p-4"></div>
        </div>
        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6">
          <h2 class="text-xl font-semibold">Milestone journey</h2>
          <div id="careerPath" class="mt-4 space-y-3"></div>
        </div>
      </section>
    </div>
    <script>
      const summary = document.getElementById('careerSummary');
      const path = document.getElementById('careerPath');
      document.getElementById('careerBtn').addEventListener('click', async () => {
        const career = document.getElementById('careerSelect').value;
        const response = await fetch(`/planning/career-path?career_goal=${encodeURIComponent(career)}`);
        const payload = await response.json();
        summary.innerHTML = `<div class="text-sm text-cyan-200">Career focus</div><div class="text-2xl font-semibold">${payload.career_goal}</div><div class="mt-3 text-sm text-slate-400">Required skills: ${payload.requirements.map((item) => item.skill).join(', ')}</div>`;
        path.innerHTML = payload.milestones.map((step) => `
          <div class="rounded-2xl border border-white/10 bg-slate-800/80 p-3">
            <div class="text-sm font-semibold text-cyan-200">Step ${step.step}: ${step.title}</div>
            <div class="mt-2 text-sm text-slate-400">${step.skills.join(' • ')}</div>
          </div>
        `).join('');
      });
    </script>
  </body>
</html>
